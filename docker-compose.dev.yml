# Infrastructure only, for running the server from your IDE: docker compose -f docker-compose.dev.yml up -d
services:
  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: hookrelay
      MARIADB_USER: hookrelay
      MARIADB_PASSWORD: hookrelay
      MARIADB_ROOT_PASSWORD: root
    ports: ["127.0.0.1:3306:3306"]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20
  rabbitmq:
    image: rabbitmq:4-management
    ports: ["127.0.0.1:5672:5672", "127.0.0.1:15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      retries: 20
