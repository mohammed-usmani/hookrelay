management:
  endpoint:
    health:
      show-components: always

hookrelay:
  admin-token: test-admin-token
  # 32 zero bytes, base64 — test only
  encryption-key: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
  ssrf:
    allow-http: true
    # WireMock runs on loopback in the test JVM
    allowed-cidrs: ["127.0.0.1/32"]
  delivery:
    # compressed so retry tests finish in seconds; production default is 5s,5m,30m,2h,5h,10h,10h
    retry-schedule: 1s,1s,1s,1s,1s,1s,1s
    send-timeout: 3s

logging:
  level:
    root: WARN
    dev.hookrelay: INFO
