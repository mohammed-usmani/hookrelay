server:
  shutdown: graceful

spring:
  application:
    name: hookrelay
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: ${HOOKRELAY_DB_URL:jdbc:mariadb://localhost:3306/hookrelay}
    username: ${HOOKRELAY_DB_USER:hookrelay}
    password: ${HOOKRELAY_DB_PASSWORD:hookrelay}
    hikari:
      # REPEATABLE READ's gap locks would let the outbox relay's claim block every outbox insert
      # while it waits for broker confirms; every decision here is taken under explicit row locks anyway
      transaction-isolation: TRANSACTION_READ_COMMITTED
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  rabbitmq:
    host: ${HOOKRELAY_RABBIT_HOST:localhost}
    port: ${HOOKRELAY_RABBIT_PORT:5672}
    username: ${HOOKRELAY_RABBIT_USER:guest}
    password: ${HOOKRELAY_RABBIT_PASSWORD:guest}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        # a message that keeps failing is dropped (and logged), never redelivered in a hot loop
        default-requeue-rejected: false

hookrelay:
  admin-token: ${HOOKRELAY_ADMIN_TOKEN:}
  encryption-key: ${HOOKRELAY_ENCRYPTION_KEY:}

management:
  server:
    # actuator lives on its own port: scrape and probe it from inside the network, never expose it
    port: ${HOOKRELAY_MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-components: always
      group:
        liveness:
          include: livenessState,ping
        readiness:
          include: readinessState,db,rabbit
  metrics:
    tags:
      application: ${spring.application.name}
