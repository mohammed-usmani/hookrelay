global:
  scrape_interval: 15s

scrape_configs:
  - job_name: hookrelay
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["hookrelay-1:8081", "hookrelay-2:8081"]

  # queue depths, consumers, unacked messages (rabbitmq_prometheus plugin, on by default in 4.x)
  - job_name: rabbitmq
    metrics_path: /metrics/per-object
    static_configs:
      - targets: ["rabbitmq:15692"]
